[project]
name = "treadmill"
version = "0.1.0"
description = "TreadMill gait console: load-cell acquisition, gait metrics and treadmill control"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyusb>=1.2.1",
    # Bundles the libusb shared library, so macOS needs no Homebrew install.
    "libusb-package>=1.0.26",
    "psutil>=5.9",
    # CoreBluetooth on the Mac, BlueZ on the N100, one API over both.
    "bleak>=0.22",
]

[project.scripts]
treadmill = "treadmill.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treadmill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Explicit try/except-pass reads more clearly than contextlib.suppress in I/O code.
ignore = ["SIM105", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
